version: 2
project_name: promptpet
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ['-s -w -X main.version={{.Version}}']
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - repository:
      owner: dpologdvinity
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/dpologdvinity/promptpet"
    description: "A tiny pet that lives in your shell prompt"
    license: "MIT"
