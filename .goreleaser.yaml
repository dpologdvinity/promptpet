version: 2
project_name: promptpet
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ['-s -w -X main.version={{.Version}}']
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
nfpms:
  - id: default
    package_name: promptpet
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Kaitlyn Bassford
    homepage: "https://github.com/dpologdvinity/promptpet"
    maintainer: "Kaitlyn Bassford <kaitlynbassford@gmail.com>"
    description: "A tiny pet that lives in your shell prompt"
    license: "MIT"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: internal/hooks/completion.bash
        dst: /usr/share/bash-completion/completions/promptpet
        file_info:
          mode: 0644
      - src: internal/hooks/completion.zsh
        dst: /usr/share/zsh/vendor-completions/_promptpet
        file_info:
          mode: 0644
      - src: internal/hooks/completion.fish
        dst: /usr/share/fish/vendor_completions.d/promptpet.fish
        file_info:
          mode: 0644
