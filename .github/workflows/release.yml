name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests before release
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Run GoReleaser Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        if: ${{ env.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: dpologdvinity/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Update Formula
        if: ${{ env.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          repo="${GITHUB_REPOSITORY}"

          sums=$(curl -fsSL "https://github.com/${repo}/releases/download/${tag}/checksums.txt")
          sum() { echo "$sums" | awk -v f="promptpet_${ver}_$1.tar.gz" '$2==f {print $1}'; }
          url() { echo "https://github.com/${repo}/releases/download/${tag}/promptpet_${ver}_$1.tar.gz"; }

          darwin_arm64_sha=$(sum darwin_arm64)
          darwin_amd64_sha=$(sum darwin_amd64)
          linux_arm64_sha=$(sum linux_arm64)
          linux_amd64_sha=$(sum linux_amd64)

          mkdir -p tap/Formula
          cat > tap/Formula/promptpet.rb <<EOF
          # Generated by promptpet release workflow; do not edit by hand.
          class Promptpet < Formula
            desc "A tiny pet that lives in your shell prompt"
            homepage "https://github.com/${repo}"
            version "${ver}"
            license "MIT"

            on_macos do
              on_arm do
                url "$(url darwin_arm64)"
                sha256 "${darwin_arm64_sha}"
              end
              on_intel do
                url "$(url darwin_amd64)"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "$(url linux_arm64)"
                sha256 "${linux_arm64_sha}"
              end
              on_intel do
                url "$(url linux_amd64)"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "promptpet"
              generate_completions_from_executable(bin/"promptpet", "completion")
            end

            test do
              assert_match "promptpet #{version}", shell_output("#{bin}/promptpet --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/promptpet.rb
          if ! git diff --staged --quiet; then
            git commit -m "feat: update promptpet to ${ver}"
            git push
          fi
