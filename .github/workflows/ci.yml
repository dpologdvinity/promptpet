name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go environment
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check code formatting
        run: |
          DIFF="$(gofmt -s -l .)"
          if [ -n "$DIFF" ]; then
            echo "gofmt found unformatted files:"
            echo "$DIFF"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go environment
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shell test dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install shell test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install fish || true

      - name: Run tests with coverage & race detector
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run performance benchmarks
        run: go test -bench=. -run=^$ ./test/...

      - name: Check prompt latency of the built binary
        if: matrix.os == 'ubuntu-latest'
        env:
          PROMPTPET_LATENCY_TEST: "1"
        # -count=1: the test times the built binary, a dependency Go's test cache
        # cannot see, so a cached result could hide a slower build.
        run: go test -count=1 -run TestPromptBinaryLatency -v ./test/

      - name: Generate text coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build:
    name: Build & Verify Artifacts
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go environment
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build snapshot artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: build --snapshot --clean

      - name: Verify compiled executable
        run: |
          ./dist/promptpet_linux_amd64_v1/promptpet --version
          ./dist/promptpet_linux_amd64_v1/promptpet --help
          ./dist/promptpet-gui_linux_amd64_v1/promptpet-gui --version
